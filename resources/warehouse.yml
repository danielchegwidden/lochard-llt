resources:
  sql_warehouses:
    lochard_wh:
      name: lochard-serverless-wh
      warehouse_type: PRO
      enable_serverless_compute: true
      cluster_size: Small
      auto_stop_mins: 10
      min_num_clusters: 1
      max_num_clusters: 2
      tags:
        custom_tags:
          - key: project
            value: lochard
      permissions:
        - {service_principal_name: "${resources.apps.board_portal_app.service_principal_client_id}", level: CAN_USE}
        - {group_name: users, level: CAN_USE}

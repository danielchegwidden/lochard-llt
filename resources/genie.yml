8d6aae060a13d22376d2d3\", \"question\": [\"Which teams are forecasting (YEO) furthest below budget in FY2027?\"], \"sql\": [\"SELECT team, SUM(yeo_amount) - SUM(budget_amount) AS yeo_vs_budget FROM ${var.catalog}.${resources.schemas.semantic.name}.v_finance_monthly WHERE financial_year = 'FY2027' GROUP BY team ORDER BY yeo_vs_budget\"]}]}, \"benchmarks\": {\"questions\": [{\"id\": \"08808abd8e2050a7bab214153db5a704\", \"question\": [\"What is the variance of actuals versus budget for Employee Costs in FY2027?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(actual_amount) - SUM(budget_amount) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_finance_monthly WHERE financial_year = 'FY2027' AND team = 'Employee Costs'\"]}]}, {\"id\": \"0f9a7304a3478e8c66402d2ddbd8de52\", \"question\": [\"What is the FY2027 YEO for Major Projects?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(yeo_amount) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_finance_monthly WHERE financial_year = 'FY2027' AND team = 'Major Projects'\"]}]}, {\"id\": \"11171fc8a5f75fde3981481619757452\", \"question\": [\"What is the committed cost for Growth in FY2027?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(committed_amount) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_finance_monthly WHERE financial_year = 'FY2027' AND team = 'Growth'\"]}]}, {\"id\": \"46bf69ddf84a33dbccf782c05a28f559\", \"question\": [\"What are YTD actuals on cost centre PRM-0021E in FY2027?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(amount) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_gl_transaction_detail WHERE financial_year = 'FY2027' AND cost_centre_key = 'PRM-0021E'\"]}]}, {\"id\": \"6b09c72f977b8310d5d6bc39fae16a94\", \"question\": [\"How much FY2027 spend is classified as Emergent?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(amount) FROM ${var.catalog}.${resources.schemas.semantic.name}.
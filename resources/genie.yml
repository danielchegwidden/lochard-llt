se is_open. Closed means status = 'CLOSED'.\\n\", \"observation_type values: HAZARD, INCIDENT, NEARMISS, SAFEACT, HAZARD_REPORT (legacy form, retired 2020), Other.\\n\", \"incident_category values: GENERAL SAFETY, PROCESS SAFETY, PRODUCTION, ENVIRONMENTAL, Other. Risk ranks: HIGH, MEDIUM, LOW, Unknown (actual_risk_rank = assessed outcome; potential_risk_rank = worst credible outcome).\\n\", \"A High Potential Event (HPE) is is_high_potential_event = true. TRIFR = recordable injuries per million hours worked (rolling 12 months) from v_hse_monthly.\\n\", \"Legally privileged investigation rows may be hidden by governance; v_investigation_counts gives safe totals.\\n\"]}], \"example_question_sqls\": [{\"id\": \"82bf8ec60c77fb116d95552815803829\", \"question\": [\"How many observations are currently open by risk rank?\"], \"sql\": [\"SELECT actual_risk_rank, COUNT(*) AS open_observations FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE classification = 'INCIDENT' AND is_open GROUP BY actual_risk_rank ORDER BY open_observations DESC\"]}, {\"id\": \"a3c1ae7e1a0d14c62e033e656ef0b26b\", \"question\": [\"How many observations were raised each month this financial year by type?\"], \"sql\": [\"SELECT month_start, observation_type, COUNT(*) AS observations FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE classification = 'INCIDENT' AND financial_year = 'FY2027' GROUP BY ALL ORDER BY month_start\"]}, {\"id\": \"aa35986554595d7d5569c902d256a137\", \"question\": [\"What is the latest rolling 12 month TRIFR?\"], \"sql\": [\"SELECT month_start, trifr_rolling_12m FROM ${var.catalog}.${resources.schemas.semantic.name}.v_hse_monthly ORDER BY month_start DESC LIMIT 1\"]}]}, \"benchmarks\": {\"questions\": [{\"id\": \"7bad549b1204953842b5c6241450f73e\", \"question\": [\"How many observations are open?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT(*) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE classification = 'INCIDENT' AND is_open\"]}]}, {\"id\": \"843e02dde4efffd648262dfeb52b17d6\", \"question\": [\"How many open observations have a HIGH actual risk rank?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT(*) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE classification = 'INCIDENT' AND is_open AND actual_risk_rank = 'HIGH'\"]}]}, {\"id\": \"8a65984fcd824a3f3295d1ea091233d4\", \"question\": [\"How many High Potential Events occurred in FY2027?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT(*) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE is_high_potential_event AND financial_year = 'FY2027'\"]}]}, {\"id\": \"97fbc5ccbfa8338990b8ff77e9b056be\", \"question\": [\"How many investigations are open?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT(*) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE classification = 'INVESTIGATION' AND is_open\"]}]}, {\"id\": \"bc6e83ea69467876a365ef6436c7ca28\", \"question\": [\"How many observations are there in total?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT(*) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE classification = 'INCIDENT'\"]}]}, {\"id\": \"f7f7b0b717fb9085ca6c4eb284314e2f\", \"question\": [\"What share of observations are GENERAL SAFETY?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT_IF(incident_category = 'GENERAL SAFETY') / COUNT(*) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_observation_detail WHERE classification = 'INCIDENT'\"]}]}]}}"

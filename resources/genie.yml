rs were scheduled across the last 13 weeks?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(scheduled_count) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_workorder_schedule_weekly WHERE is_latest_snapshot AND work_type = 'PM'\"]}]}, {\"id\": \"23d0862ca50b80b76247e09778f2d595\", \"question\": [\"How many open P1 work orders are there?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(workorder_count) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_workorder_schedule_weekly WHERE is_latest_snapshot AND priority_bucket = 'P1' AND is_open\"]}]}, {\"id\": \"6a266f7514ba2e1aa7d24065ee314c31\", \"question\": [\"How many overdue safety critical work orders are there?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(overdue_safety_critical_count) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_workorder_schedule_weekly WHERE is_latest_snapshot\"]}]}, {\"id\": \"d96084990d56aa98edeb779d08e47998\", \"question\": [\"What is the backlog excluding PMs?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(backlog_count) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_workorder_schedule_weekly WHERE is_latest_snapshot AND work_type <> 'PM'\"]}]}]}}"

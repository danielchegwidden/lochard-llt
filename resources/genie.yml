      serialized_space: "{\"version\": 2, \"config\": {\"sample_questions\": [{\"id\": \"1f86336c98410d7dd76b212941c36270\", \"question\": [\"How does cumulative VIC demand this year compare to 2021-2024?\"]}, {\"id\": \"44627453745e3e558db70ad352d6f008\", \"question\": [\"How much real AEMO data do we have?\"]}, {\"id\": \"4b966b717da6291f20def9ec36bcc283\", \"question\": [\"What is Iona's current inventory?\"]}, {\"id\": \"6aeec2818eccd8027675a4544456062c\", \"question\": [\"What was the peak Iona withdrawal day this winter?\"]}]}, \"data_sources\": {\"tables\": [{\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_cumulative_vic_demand\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_iona_operations_daily\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_nominations\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_vic_gas_demand_daily\"}], \"metric_views\": [{\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_iona_ops\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_market\"}]}, \"instructions\": {\"text_instructions\": [{\"id\": \"c9350d1395a458ff330c2f14626cc82f\", \"content\": [\"You are answering questions for Lochard Energy, operator of the Iona Gas Storage Facility (Port Campbell, VIC) through the entity Iona Ops Trust. Currency is AUD, amounts exclude GST.\\n\", \"The Australian financial year runs 1 July to 30 June: FY2027 = 1 Jul 2026 to 30 Jun 2027. Quarters: Q1 = Jul-Sep, Q2 = Oct-Dec, Q3 = Jan-Mar, Q4 = Apr-Jun. 'This year' means FY2027 unless the user says calendar year.\\n\", \"Never reveal or guess people's names. Person columns may be masked (PERSON-xxxx) by governance policy – say so rather than trying to work around it.\\n\", \"If a question cannot be answered from the data, say so clearly and suggest the closest question that can be answered.\\n\", \"Units: total_gas_used_gj is GJ per gas day; 1 TJ = 1,000 GJ; 1 PJ = 1,000 TJ. Present demand in TJ/day or PJ.\\n\", \"EDD (effective degree days) is AEMO's weather index for heating demand – higher EDD = colder = more gas demand.\\n\", \"demand_source / edd_source = 'AEMO' for real nemweb data (recent days) and 'SYNTHETIC' for backfilled history.\\n\", \"Iona: working inventory in PJ (capacity ~24.4 PJ, 26.2 PJ after HUGS), withdrawal up to ~570 TJ/day. net_withdrawal_tj = withdrawal - injection.\\n\", \"Nominations: within_tolerance = |delivered / nominated - 1| <= 4% (scorecard KPI 1.2).\\n\"]}], \"example_question_sqls\": [{\"id\": \"1826e3021f78b6f9889b08c1f2e0199a\", \"question\": [\"What share of nominations were delivered within tolerance in FY2027?\"], \"sql\": [\"SELECT AVG(CASE WHEN within_tolerance THEN 1 ELSE 0 END) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_nominations WHERE financial_year = 'FY2027'\"]}, {\"id\": \"3d7666310aed7df9927046ebcc09bc58\", \"question\": [\"How well does EDD explain demand on weekdays vs weekends?\"], \"sql\": [\"SELECT is_weekend, POWER(CORR(edd_value, total_gas_used_tj), 2) AS r_squared FROM ${var.catalog}.${resources.schemas.semantic.name}.v_vic_gas_demand_daily GROUP BY is_weekend\"]}, {\"id\": \"cedccb9e742b6b26c52dfd156b9fc11e\", \"question\": [\"What was total VIC gas demand by month in 2024 in PJ?\"], \"sql\": [\"SELECT gas_month, SUM(total_gas_used_pj) AS demand_pj FROM ${var.catalog}.${resources.schemas.semantic.name}.v_vic_gas_demand_daily WHERE gas_year = 2024 GROUP BY gas_month ORDER BY gas_month\"]}]}, \"benchmarks\": {\"questions\": [{\"id\": \"1caa1a30513e6f1883521e6adcfc180f\", \"question\": [\"What was VIC demand in July 2022 in PJ?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(total_gas_used_pj) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_vic_gas_demand_daily WHERE gas_year = 2022 AND gas_month = 7\"]}]}, {\"id\": \"24a427a2eb27ac64c60aeeed7cdfc300\", \"question\": [\"What was total VIC demand from January to August 2021 in PJ?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(total_gas_used_pj) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_vic_gas_demand_daily WHERE gas_year = 2021 AND gas_month <= 8\"]}]}, {\"id\": \"52f2d509f5022954aa774e80e440b140\", \"question\": [\"How many nomination deliveries were outside tolerance in FY2027?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT_IF(NOT within_tolerance) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_nominations WHERE financial_year = 'FY2027'\"]}]}, {\"id\": \"c299b2ba8b3dcb90bd2a6b54a65184a9\", \"question\": [\"What is the latest Iona inventory in PJ?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT inventory_pj FROM ${var.catalog}.${resources.schemas.semantic.name}.v_iona_operations_daily ORDER BY gas_date DESC LIMIT 1\"]}]}]}}"

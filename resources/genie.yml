      description: "Board and Lochard Leadership Team view: FY27 scorecard (status, weights, board scores, commentary) with the governed headline KPIs for Finance, HSE, Maintenance, Gas Market and Iona operations, plus weekly market intelligence (public news and announcements about Lochard, customers, competitors, suppliers, regulators and the gas market)."
      warehouse_id: "${var.warehouse_id}"
      serialized_space: "{\"version\": 2, \"config\": {\"sample_questions\": [{\"id\": \"3e1d44753f5e5c203dd55781a4f25bf8\", \"question\": [\"How are we tracking on the FY27 scorecard?\"]}, {\"id\": \"7d7b46b44d474e78d56cf35c28d3061c\", \"question\": [\"What were the key market developments for Lochard last week?\"]}, {\"id\": \"a61514430c0b94f846313199755b3910\", \"question\": [\"How do board scores compare with management's status?\"]}, {\"id\": \"ab7b846ee167c6f95a237d305da1a8bc\", \"question\": [\"Which KPIs are at risk and what is the commentary?\"]}, {\"id\": \"ec5ca4dadfeb60caeb43d6b251039156\", \"question\": [\"What are the headline HSE and finance numbers this month?\"]}]}, \"data_sources\": {\"tables\": [{\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_board_comments\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_hse_monthly\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_investigation_counts\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_market_intel_briefs\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_market_intel_entities\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_market_intel_items\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.v_nominations\"}], \"metric_views\": [{\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_board\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_finance\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_hse\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_iona_ops\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_maintenance\"}, {\"identifier\": \"${var.catalog}.${resources.schemas.semantic.name}.mv_market\"}]}, \"instructions\": {\"text_instructions\": [{\"id\": \"222203e306340301e992f413b6335602\", \"content\": [\"You are answering questions for Lochard Energy, operator of the Iona Gas Storage Facility (Port Campbell, VIC) through the entity Iona Ops Trust. Currency is AUD, amounts exclude GST.\\n\", \"The Australian financial year runs 1 July to 30 June: FY2027 = 1 Jul 2026 to 30 Jun 2027. Quarters: Q1 = Jul-Sep, Q2 = Oct-Dec, Q3 = Jan-Mar, Q4 = Apr-Jun. 'This year' means FY2027 unless the user says calendar year.\\n\", \"Never reveal or guess people's names. Person columns may be masked (PERSON-xxxx) by governance policy – say so rather than trying to work around it.\\n\", \"If a question cannot be answered from the data, say so clearly and suggest the closest question that can be answered.\\n\", \"Audience: Board directors and the Lochard Leadership Team (LLT). Lead with the answer, then 2-3 supporting facts with the period and source.\\n\", \"Scorecard: v_board_scorecard has one row per KPI per reporting period (period_code e.g. FY27-M02 = August 2026). Status values ON_TRACK, AT_RISK, OFF_TRACK, COMPLETE. Weights sum to 100% per financial year.\\n\", \"Weighted status index = SUM(weight_pct * status_points) / SUM(weight_pct) where On Track / Complete = 1, At Risk = 0.5, Off Track = 0. Board score = average director score (0-5).\\n\", \"Owners are shown as role initials (DA = COO, BN = GM Commercial, DS = GM Project Delivery, DG = GM Development, LLT = Leadership Team). Never name individuals.\\n\", \"For headline KPIs use the metric views: mv_finance (budget / actuals / YEO / committed), mv_hse (observations, HPEs), mv_maintenance (schedule compliance, backlog – filter is_latest_snapshot), mv_market (VIC demand, EDD), mv_iona_ops (inventory, flows) and mv_board (status index, board score, KPIs at risk).\\n\", \"Investigation detail is restricted – use v_investigation_counts for counts.\\n\", \"Market intelligence: v_market_intel_items has one row per public news item or announcement (week_start = Monday, entity_group in Lochard / Customer / Competitor / Upstream supplier / Regulator & market body / Government & policy / Industry & market; signal Opportunity / Threat / Watch / Neutral from Lochard's perspective; importance 1-5). v_market_intel_briefs has the weekly brief written by the Market Intelligence Analyst agent (headline, summary_md). 'Last week' means the most recent complete Monday-Sunday week. Always include the title, publisher and url of items you cite, and say that the items are public sources summarised by AI.\\n\"]}], \"example_question_sqls\": [{\"id\": \"2f964c2c97968330725648274e8b3f8b\", \"question\": [\"Which FY27 scorecard KPIs are at risk and why?\"], \"sql\": [\"SELECT kpi_code, kpi_name, weight_pct, status, commentary FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE fy_code = 'FY27' AND period_code = (SELECT max(period_code) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE fy_code = 'FY27' AND status IS NOT NULL) AND status IN ('AT_RISK', 'OFF_TRACK') ORDER BY kpi_code\"]}, {\"id\": \"424cec9c371fe5fb974cbb1fd7b30fe6\", \"question\": [\"What were the most important market developments last week?\"], \"sql\": [\"SELECT published_date, title, source_name, entity_group, signal, importance, why_it_matters, url FROM ${var.catalog}.${resources.schemas.semantic.name}.v_market_intel_items WHERE week_start = date_sub(date_trunc('WEEK', current_date()), 7) ORDER BY importance DESC, published_date DESC LIMIT 10\"]}, {\"id\": \"685c2ce51395e04f9728daa809fb4c0d\", \"question\": [\"What did competitors do in the last four weeks?\"], \"sql\": [\"SELECT published_date, primary_entity, title, signal, why_it_matters, url FROM ${var.catalog}.${resources.schemas.semantic.name}.v_market_intel_items WHERE entity_group = 'Competitor' AND week_start >= date_sub(date_trunc('WEEK', current_date()), 28) ORDER BY importance DESC, published_date DESC\"]}, {\"id\": \"d3cfd97c95388a6ca7f22730320aca83\", \"question\": [\"How did FY26 finish on the scorecard?\"], \"sql\": [\"SELECT kpi_code, kpi_name, weight_pct, status, avg_board_score FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE period_code = 'FY26-M12' ORDER BY kpi_code\"]}, {\"id\": \"d5a1ff1d014c6ff075bf40971d5de950\", \"question\": [\"What is the weighted scorecard status index by month in FY27?\"], \"sql\": [\"SELECT period_code, SUM(weight_pct * status_points) / SUM(weight_pct) AS status_index FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE fy_code = 'FY27' AND status IS NOT NULL GROUP BY period_code ORDER BY period_code\"]}]}, \"benchmarks\": {\"questions\": [{\"id\": \"a419344f387c4fc4017dfebc6081adcb\", \"question\": [\"How many FY27 KPIs are at risk in August 2026?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT COUNT(*) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE period_code = 'FY27-M02' AND status = 'AT_RISK'\"]}]}, {\"id\": \"b15cfb3f9c6df557159602f5f777a04c\", \"question\": [\"What is the average board score for HUGS Delivery in August 2026?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT avg_board_score FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE period_code = 'FY27-M02' AND kpi_code = '2.1'\"]}]}, {\"id\": \"b959ac0312e55a2a05e4a7abd5d44c29\", \"question\": [\"What is the FY27 weighted status index for August 2026?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT SUM(weight_pct * status_points) / SUM(weight_pct) FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE period_code = 'FY27-M02'\"]}]}, {\"id\": \"f4869ddead3994071603fddaa3848656\", \"question\": [\"What is the weight of the HSE Performance KPI in FY27?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT weight_pct FROM ${var.catalog}.${resources.schemas.semantic.name}.v_board_scorecard WHERE fy_code = 'FY27' AND kpi_code = '1.1' LIMIT 1\"]}]}]}}"
      permissions:
        - {group_name: users, level: CAN_RUN}
